<meta name="claude:viewport-fit-sides" content="cover">
<title>同词相遇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 同词相遇 · 双人默契版 =====
   视觉方向：信纸 × 朱砂印 · 甲乙两人各自写下一个词，同时揭晓。
   色：暖纸底 + 墨字 + 甲朱砂 / 乙青蓝 + 玉石绿(相遇)。
   型：宋体作揭晓大字、黑体作界面。布局：居中单列，双人面板并排。 */
:root{
  --bg:#F5EFE3; --bg-2:#EDE4D2;
  --surface:#FFFDF8; --surface-2:#F0E7D6;
  --fg:#2B251C; --muted:#7C7160;
  --accent:#BC4327; --accent-ink:#FFFDF8;
  --pa:#BC4327; --pa-soft:#F5E2DA;
  --pb:#2E6E8C; --pb-soft:#DCE9F0;
  --match:#3E6E52; --match-ink:#F2F7F1; --gold:#C9A24B;
  --shadow:0 1px 2px rgba(43,37,28,.06), 0 10px 28px rgba(43,37,28,.10);
  --shadow-lg:0 2px 6px rgba(43,37,28,.10), 0 24px 64px rgba(43,37,28,.22);
  --ring:0 0 0 3px rgba(188,67,39,.35);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191510; --bg-2:#221C15;
    --surface:#241F19; --surface-2:#2D2720;
    --fg:#EFE7D8; --muted:#A2957E;
    --accent:#E2683E; --accent-ink:#1B130E;
    --pa:#E2683E; --pa-soft:#3A241C;
    --pb:#6FA6C4; --pb-soft:#1E2C34;
    --match:#6EA583; --match-ink:#10231A; --gold:#D9B464;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.55);
    --ring:0 0 0 3px rgba(226,104,62,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191510; --bg-2:#221C15;
  --surface:#241F19; --surface-2:#2D2720;
  --fg:#EFE7D8; --muted:#A2957E;
  --accent:#E2683E; --accent-ink:#1B130E;
  --pa:#E2683E; --pa-soft:#3A241C;
  --pb:#6FA6C4; --pb-soft:#1E2C34;
  --match:#6EA583; --match-ink:#10231A; --gold:#D9B464;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(226,104,62,.4);
  color-scheme:dark;
}

html,body{ height:100%; }
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%, var(--bg-2) 0, transparent 42%),
                   radial-gradient(circle at 88% 92%, var(--bg-2) 0, transparent 46%);
  color:var(--fg);
  font-family:var(--sans);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px 56px;
  margin:0;
}
.app{ max-width:640px; margin:0 auto; }

/* 顶部 */
.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.brand{ display:flex; align-items:center; gap:14px; }
.seal{
  flex:0 0 auto; width:46px; height:46px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink);
  font-family:var(--serif); font-size:24px; font-weight:700;
  border-radius:8px; transform:rotate(-4deg); box-shadow:var(--shadow);
}
.brand h1{ margin:0; font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:.06em; text-wrap:balance; }
.brand .tag{ margin:2px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
.mute{
  flex:0 0 auto; margin-top:6px; font:inherit; font-size:13px; color:var(--muted);
  background:var(--surface); border:1px solid var(--surface-2);
  border-radius:999px; padding:7px 13px; cursor:pointer;
}
.mute:focus-visible{ outline:none; box-shadow:var(--ring); }

/* 计时器 */
.timer{ position:relative; width:96px; height:96px; margin:22px auto 18px; }
.ring{ width:96px; height:96px; }
.ring circle{ fill:none; stroke-width:6; }
.ring-bg{ stroke:var(--surface-2); }
.ring-fg{ stroke:var(--accent); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; stroke-dasharray:276.46; stroke-dashoffset:0; transition:stroke-dashoffset .9s linear, stroke .3s; }
.timer .time{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.timer .time b{ font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
.timer .time span{ display:block; font-size:11px; color:var(--muted); margin-top:2px; }
body.urgent .ring-fg{ stroke:var(--accent); }
body.urgent .timer .time b{ color:var(--accent); animation:pulse 1s infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.14);} }

/* 双人面板 */
.duo{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.panel{
  background:var(--surface); border:1px solid var(--surface-2);
  border-radius:18px; overflow:hidden; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.phead{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; }
.panel-a .phead{ background:var(--pa-soft); }
.panel-b .phead{ background:var(--pb-soft); }
.pname{ font-family:var(--serif); font-size:20px; font-weight:700; }
.panel-a .pname{ color:var(--pa); }
.panel-b .pname{ color:var(--pb); }
.pstatus{ font-size:12px; color:var(--muted); }
.pbody{ flex:1; display:grid; place-items:center; padding:16px 12px; min-height:150px; text-align:center; }
.pinput{
  width:100%; box-sizing:border-box; font:inherit; font-size:18px; text-align:center;
  color:var(--fg); background:var(--surface-2); border:1px solid var(--surface-2);
  border-radius:10px; padding:12px 8px;
}
.pinput:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); background:var(--surface); }
.plocked{ display:grid; gap:6px; place-items:center; color:var(--muted); }
.plocked .dots{ font-size:20px; letter-spacing:4px; color:var(--fg); }
.plocked small{ font-size:12px; }
.pword{
  font-family:var(--serif); font-size:clamp(1.6rem, 7vw, 2.4rem); font-weight:700; letter-spacing:.04em;
  word-break:break-all; line-height:1.2;
}
.panel-a .pword{ color:var(--pa); }
.panel-b .pword{ color:var(--pb); }
.pword.show{ animation:pop .45s both; }
.pword.win{ color:var(--match); text-shadow:0 2px 18px rgba(62,110,82,.35); }
@keyframes pop{ 0%{ transform:scale(.5); opacity:0;} 60%{ transform:scale(1.1);} 100%{ transform:scale(1); opacity:1;} }
.plock{
  font:inherit; font-size:14px; font-weight:700; color:var(--fg);
  background:var(--surface-2); border:0; padding:11px; cursor:pointer; margin:0;
}
.panel-a .plock{ color:var(--accent-ink); background:var(--pa); }
.panel-b .plock{ color:var(--accent-ink); background:var(--pb); }
.plock:focus-visible{ outline:none; box-shadow:inset 0 0 0 3px rgba(255,255,255,.35); }
.plock.secondary{ background:var(--surface-2); color:var(--fg); }

/* 判定 */
.verdict{ text-align:center; margin-top:18px; font-family:var(--serif); font-size:20px; font-weight:700; min-height:30px; }
.verdict.win{ color:var(--match); }
.verdict.lose{ color:var(--muted); }
.roundnote{ text-align:center; margin-top:8px; color:var(--muted); font-size:13px; }

.hint{ margin:20px auto 0; max-width:480px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7; }

/* 结算浮层 */
.overlay{
  position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:24px;
  background:rgba(20,16,11,.55); backdrop-filter:blur(3px);
}
.overlay[hidden]{ display:none; }
.win{
  width:min(400px,100%); max-height:88vh; display:flex; flex-direction:column;
  background:var(--surface); color:var(--fg);
  border-radius:20px; padding:26px 22px; text-align:center; box-shadow:var(--shadow-lg);
  animation:cardIn .4s both;
}
@keyframes cardIn{ from{ opacity:0; transform:translateY(12px) scale(.97);} to{ opacity:1; transform:none;} }
.win .mark{ font-family:var(--serif); font-size:42px; line-height:1; color:var(--accent); }
.win h2{ margin:12px 0 2px; font-family:var(--serif); font-size:24px; }
.win .sub{ margin:0 0 14px; color:var(--muted); font-size:14px; }
.win .sub b{ color:var(--match); }
.rows{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.row{ padding:10px 12px; background:var(--surface-2); border-radius:10px; font-size:13px; }
.row .k{ display:block; color:var(--muted); font-size:11px; letter-spacing:.1em; }
.row .v{ display:block; margin-top:3px; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
.hist-label{ text-align:left; font-size:12px; letter-spacing:.14em; color:var(--muted); margin:6px 0 8px; }
.hist{ list-style:none; margin:0 0 16px; padding:0; overflow-y:auto; max-height:34vh; text-align:left; display:grid; gap:6px; }
.his{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--surface-2); border-radius:10px; font-size:14px; }
.his .his-n{ flex:0 0 auto; color:var(--muted); font-size:12px; }
.his .his-words{ display:flex; align-items:center; gap:8px; font-weight:600; min-width:0; }
.his .his-words em{ font-style:normal; word-break:break-all; }
.his .w-a{ color:var(--pa); }
.his .w-b{ color:var(--pb); }
.his .vs{ color:var(--muted); font-weight:400; font-size:12px; }
.his .his-ok{ flex:0 0 auto; color:var(--match); font-size:12px; font-weight:700; }
.his-match{ outline:1px solid var(--match); background:var(--match); }
.his-match .his-n, .his-match .his-words em, .his-match .vs, .his-match .his-ok{ color:var(--match-ink); }
.his-match .his-ok{ color:var(--match-ink); }
.again{
  width:100%; font:inherit; font-size:16px; font-weight:700;
  background:var(--accent); color:var(--accent-ink);
  border:0; border-radius:12px; padding:13px; cursor:pointer;
}
.again:focus-visible{ outline:none; box-shadow:var(--ring); }
.dismiss{
  margin-top:8px; font:inherit; font-size:13px; color:var(--muted);
  background:none; border:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
}
.restart{ width:min(240px,100%); margin:18px auto 0; }

#confetti{ position:fixed; inset:0; z-index:60; pointer-events:none; }
#confetti[hidden]{ display:none; }

@media (max-width:430px){
  .duo{ gap:8px; }
  .pbody{ min-height:120px; padding:12px 8px; }
  .pname{ font-size:17px; }
  .pword{ font-size:1.5rem; }
}
@media (prefers-reduced-motion:reduce){
  .ring-fg{ transition:none; }
  .pword.show{ animation:none; }
  .win{ animation:none; }
  body.urgent .timer .time b{ animation:none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">遇</span>
      <div>
        <h1>同词相遇</h1>
        <p class="tag">开局双方先「准备」，再各自想一个词，30 秒内输入并锁定，同时揭晓——相同即相遇。</p>
      </div>
    </div>
    <button class="mute" id="muteBtn" type="button" aria-pressed="true">音效 开</button>
  </header>

  <div class="timer" aria-live="polite">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring-bg" cx="50" cy="50" r="44"></circle>
      <circle class="ring-fg" cx="50" cy="50" r="44"></circle>
    </svg>
    <div class="time"><b id="timeNum">30</b><span>秒</span></div>
  </div>

  <div class="duo">
    <section class="panel panel-a" id="panelA">
      <header class="phead"><span class="pname">甲</span><span class="pstatus" id="statusA">输入中</span></header>
      <div class="pbody">
        <input class="pinput" id="inputA" maxlength="8" placeholder="输入一个词" autocomplete="off" spellcheck="false">
        <div class="plocked" id="lockedA" hidden><span class="dots">●●●●</span><small>已锁定 · 等待对方</small></div>
        <div class="pword" id="wordA" hidden></div>
      </div>
      <button class="plock" id="lockA" type="button">锁定</button>
    </section>

    <section class="panel panel-b" id="panelB">
      <header class="phead"><span class="pname">乙</span><span class="pstatus" id="statusB">输入中</span></header>
      <div class="pbody">
        <input class="pinput" id="inputB" maxlength="8" placeholder="输入一个词" autocomplete="off" spellcheck="false">
        <div class="plocked" id="lockedB" hidden><span class="dots">●●●●</span><small>已锁定 · 等待对方</small></div>
        <div class="pword" id="wordB" hidden></div>
      </div>
      <button class="plock" id="lockB" type="button">锁定</button>
    </section>
  </div>

  <div class="verdict" id="verdict" aria-live="polite"></div>
  <div class="roundnote">已进行 <b id="rounds">0</b> 轮</div>
  <button class="again restart" id="restart" type="button" hidden>再来一局</button>

  <p class="hint">玩法：开局双方先点「准备」，都准备好后才开始第一轮计时；之后每轮直接开始。<br>每轮各自输入一个词并「锁定」，双方锁定后同时揭晓；相同则胜利，不同则进入下一轮。</p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="mark" aria-hidden="true">遇</div>
    <h2 id="winTitle">相遇成功</h2>
    <p class="sub">你们想到的是同一个词：<b id="sWord">—</b></p>
    <div class="rows">
      <div class="row"><span class="k">共进行</span><span class="v" id="sRounds">0 轮</span></div>
      <div class="row"><span class="k">总用时</span><span class="v" id="sTime">00:00</span></div>
    </div>
    <div class="hist-label">所有词语</div>
    <ul class="hist" id="historyList"></ul>
    <button class="again" id="again" type="button">再来一局</button>
    <button class="dismiss" id="dismiss" type="button">先看看牌面</button>
  </div>
</div>

<canvas id="confetti" hidden></canvas>

<script>
(function(){
  "use strict";
  var ROUND_SEC = 30;
  var CIRC = 276.46;
  var players = ["A","B"];

  var state = {
    phase:"ready", ready:{A:false,B:false},
    words:{A:"",B:""}, locked:{A:false,B:false},
    timeLeft:ROUND_SEC, timer:null, round:0, history:[], gameStart:0
  };

  var audioCtx = null, confettiRAF = null, soundOn = true;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function(id){ return document.getElementById(id); };
  var ring = document.querySelector(".ring-fg");

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function fmt(s){ var m=String(Math.floor(s/60)).padStart(2,"0"); var sec=String(s%60).padStart(2,"0"); return m+":"+sec; }
  function inputEl(p){ return $("input"+p); }

  function updateTimer(){
    $("timeNum").textContent = state.timeLeft;
    ring.style.strokeDashoffset = (CIRC * (1 - state.timeLeft/ROUND_SEC)).toFixed(1);
    document.body.classList.toggle("urgent", state.timeLeft <= 10 && state.phase === "input");
  }

  function setPanelReady(p, ready){
    inputEl(p).value = ""; inputEl(p).disabled = true; inputEl(p).hidden = true;
    $("locked"+p).hidden = true;
    var w = $("word"+p); w.hidden = true; w.textContent = ""; w.className = "pword";
    var btn = $("lock"+p); btn.hidden = false;
    btn.textContent = ready ? "取消" : "准备";
    btn.classList.toggle("secondary", ready);
    $("status"+p).textContent = ready ? "已准备" : "未准备";
    $("panel"+p).classList.remove("panel-locked","panel-reveal");
  }

  function setPanelInput(p){
    inputEl(p).value = ""; inputEl(p).disabled = false; inputEl(p).hidden = false;
    $("locked"+p).hidden = true;
    var w = $("word"+p); w.hidden = true; w.textContent = ""; w.className = "pword";
    var btn = $("lock"+p); btn.hidden = false; btn.textContent = "锁定"; btn.classList.remove("secondary");
    $("status"+p).textContent = "输入中";
    $("panel"+p).classList.remove("panel-locked","panel-reveal");
  }

  function lockPanel(p){
    inputEl(p).hidden = true; inputEl(p).disabled = true;
    $("locked"+p).hidden = false;
    var btn = $("lock"+p); btn.textContent = "取消"; btn.classList.add("secondary");
    $("status"+p).textContent = "已锁定";
    $("panel"+p).classList.add("panel-locked");
  }

  function showWord(p, w){
    inputEl(p).hidden = true; $("locked"+p).hidden = true;
    var el = $("word"+p); el.textContent = (w && w.trim()) ? w : "（未作答）"; el.hidden = false;
    el.className = "pword show";
    $("lock"+p).hidden = true;
    $("status"+p).textContent = "已揭晓";
    $("panel"+p).classList.add("panel-reveal");
  }

  function startReady(){
    state.phase = "ready"; state.ready = {A:false,B:false};
    state.words = {A:"",B:""}; state.locked = {A:false,B:false};
    state.timeLeft = ROUND_SEC;
    clearInterval(state.timer); state.timer = null;
    players.forEach(function(p){ setPanelReady(p, false); });
    $("verdict").textContent = ""; $("verdict").className = "verdict";
    document.body.classList.remove("urgent");
    updateTimer();
  }

  function startInput(){
    state.phase = "input"; state.words = {A:"",B:""}; state.locked = {A:false,B:false};
    state.timeLeft = ROUND_SEC; state.round++;
    players.forEach(setPanelInput);
    updateTimer();
    clearInterval(state.timer);
    state.timer = setInterval(tick, 1000);
  }

  function tick(){
    state.timeLeft--;
    updateTimer();
    if(state.timeLeft <= 0){
      clearInterval(state.timer);
      players.forEach(function(p){ if(!state.locked[p]) state.words[p] = inputEl(p).value.trim(); });
      reveal();
    } else if(state.timeLeft <= 5 && state.phase === "input" && soundOn){
      playTick();
    }
  }

  function onReady(p){
    if(state.phase !== "ready") return;
    state.ready[p] = !state.ready[p];
    setPanelReady(p, state.ready[p]);
    if(soundOn){ ensureAudio(); playLock(); }
    if(state.ready.A && state.ready.B) startInput();
  }

  function onLock(p){
    if(state.phase !== "input") return;
    if(state.locked[p]){
      state.locked[p] = false; setPanelInput(p);
      return;
    }
    state.words[p] = inputEl(p).value.trim();
    state.locked[p] = true; lockPanel(p);
    if(soundOn) playLock();
    if(state.locked.A && state.locked.B) reveal();
  }

  function reveal(){
    if(state.phase !== "input") return;
    state.phase = "reveal";
    clearInterval(state.timer);
    document.body.classList.remove("urgent");
    var a = state.words.A, b = state.words.B;
    var match = a !== "" && b !== "" && a === b;
    players.forEach(function(p){ showWord(p, state.words[p]); });
    if(match){
      $("wordA").classList.add("win"); $("wordB").classList.add("win");
      var v = $("verdict"); v.textContent = "相遇成功！"; v.className = "verdict win";
      if(soundOn) playWin();
      if(!reduceMotion) launchConfetti();
      setTimeout(win, 900);
    } else {
      var v2 = $("verdict"); v2.textContent = "还不相同，再来一轮"; v2.className = "verdict lose";
      if(soundOn) playMismatch();
      setTimeout(function(){ pushHistory(false); startInput(); }, 2000);
    }
  }

  function pushHistory(match){
    state.history.push({a:state.words.A, b:state.words.B, match:match});
    $("rounds").textContent = state.history.length;
  }

  function win(){
    pushHistory(true);
    var h = state.history[state.history.length-1];
    $("sWord").textContent = h.a;
    $("sRounds").textContent = state.history.length + " 轮";
    $("sTime").textContent = fmt(Math.max(0, Math.round((Date.now() - state.gameStart)/1000)));
    buildList();
    $("overlay").hidden = false;
    $("restart").hidden = false;
  }

  function buildList(){
    var ul = $("historyList"); ul.innerHTML = "";
    state.history.forEach(function(h, i){
      var li = document.createElement("li");
      li.className = h.match ? "his his-match" : "his";
      li.innerHTML =
        '<span class="his-n">第 '+(i+1)+' 轮</span>'+
        '<span class="his-words"><em class="w-a">'+esc(h.a || "—")+'</em><em class="vs">/</em><em class="w-b">'+esc(h.b || "—")+'</em></span>'+
        (h.match ? '<span class="his-ok">相遇 ✓</span>' : '');
      ul.appendChild(li);
    });
  }

  function newGame(){
    clearInterval(state.timer);
    state.history = []; state.round = 0;
    state.gameStart = Date.now();
    $("rounds").textContent = "0";
    $("overlay").hidden = true; stopConfetti();
    $("restart").hidden = true;
    startReady();
  }

  /* —— 音效 —— */
  function ensureAudio(){
    if(audioCtx) return;
    try{ var AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }catch(e){}
  }
  function tone(freq, when, dur, vol, type){
    if(!audioCtx) return;
    try{
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      var t = audioCtx.currentTime + when;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }catch(e){}
  }
  function playLock(){ tone(520, 0, .09, .05); }
  function playTick(){ tone(920, 0, .05, .03); }
  function playMismatch(){ tone(300, 0, .18, .06); tone(240, .12, .2, .06); }
  function playWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f, i*0.11, .3, .07); }); }

  /* —— 彩带 —— */
  function launchConfetti(){
    var canvas = $("confetti"); canvas.hidden = false;
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var ctx = canvas.getContext("2d");
    var colors = ["#BC4327","#E2683E","#C9A24B","#3E6E52","#2E6E8C","#E8DCC3"];
    var parts = [];
    for(var i=0;i<120;i++){
      parts.push({x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.4,
        vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3.4,
        s:4+Math.random()*6, r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.24,
        c:colors[i%colors.length]});
    }
    function step(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var alive = false;
      parts.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y > canvas.height + 20) p.y = -20; else alive = true;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); ctx.restore();
      });
      if(alive) confettiRAF = requestAnimationFrame(step); else canvas.hidden = true;
    }
    step();
  }
  function stopConfetti(){ if(confettiRAF) cancelAnimationFrame(confettiRAF); $("confetti").hidden = true; }

  /* —— 事件 —— */
  players.forEach(function(p){
    var input = inputEl(p);
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); onLock(p); }
    });
    $("lock"+p).addEventListener("click", function(){
      ensureAudio();
      if(state.phase === "ready") onReady(p); else onLock(p);
    });
    input.addEventListener("input", function(){ ensureAudio(); });
  });
  $("again").addEventListener("click", function(){ newGame(); });
  $("restart").addEventListener("click", function(){ newGame(); });
  $("dismiss").addEventListener("click", function(){ $("overlay").hidden = true; });
  $("muteBtn").addEventListener("click", function(){
    soundOn = !soundOn;
    this.textContent = soundOn ? "音效 开" : "音效 关";
    this.setAttribute("aria-pressed", soundOn ? "true" : "false");
  });

  /* —— 启动 —— */
  function start(){
    state.gameStart = Date.now();
    startReady();
  }
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start();
  }
})();
</script>
